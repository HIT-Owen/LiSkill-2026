[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liskill"
version = "0.1.0"
description = "LiSkill: term-level license conflict detection for Agent Skill ecosystems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# full-scale collection / storage
store = ["pymongo>=4.6"]
# license understanding model (LoRA SFT of Qwen3.5-9B)
train = ["torch>=2.1", "transformers>=4.44", "peft>=0.11", "trl>=0.9", "datasets>=2.19"]
# eq. (2) sentence embeddings
embed = ["transformers>=4.51.0", "sentence-transformers>=2.7.0"]
dev = ["pytest>=7.4"]

[project.scripts]
liskill = "liskill.cli:main"

[tool.setuptools.packages.find]
include = ["liskill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
